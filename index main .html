<title>Fikir Jürisi</title>
<style>
:root{
  --bg:#181530;--card:#221e42;--card2:#2b2652;--line:#3a3470;--text:#f3efff;--muted:#a9a3d6;
  --accent:#f6c445;--accent-ink:#2b2750;--ink:#2b2750;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f4f1ff;--card:#ffffff;--card2:#ece7ff;--line:#d9d1fb;--text:#231f45;--muted:#6a64a0;--accent:#5b45e0;--accent-ink:#ffffff}
}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:640px;margin:0 auto;padding:12px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 14px}
header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.2px}
.nav{display:flex;gap:6px}
.nav button{background:var(--card);border:2px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;font-weight:700}
.nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.hero{display:flex;justify-content:center;align-items:flex-end;padding:6px 0 4px}
.hero svg{margin:0 -7px}
.lead{color:var(--muted);margin:6px 0 14px;text-align:center;font-size:15px}
textarea,input{width:100%;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit}
textarea{min-height:170px;resize:vertical}
label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.primary{width:100%;margin-top:14px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:15px;font:inherit;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.primary:disabled{opacity:.5}
.ghost{background:var(--card);border:2px solid var(--line);color:var(--text);border-radius:14px;padding:10px 14px;font:inherit;font-weight:700;font-size:14px}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--bg);border:2px solid var(--line);color:var(--text);border-radius:16px;padding:10px 4px;font:inherit;font-size:14px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--card2)}
.seg small{display:block;color:var(--muted);font-weight:600}
.hidden{display:none!important}
.err{color:#ff7a8a;font-size:14px;margin-top:10px;white-space:pre-wrap}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.muted{color:var(--muted);font-size:14px}
.ring{display:flex;justify-content:center;padding:4px 0}
.ring svg{width:190px;height:190px}
.ring .num{font-size:56px;font-weight:800;fill:var(--text)}
.ring .sub{font-size:12px;fill:var(--muted)}
.chair{display:flex;gap:10px;align-items:flex-end;margin-top:4px}
.bubble{position:relative;background:var(--card2);border-radius:18px;padding:10px 14px;flex:1;font-weight:700}
.bubble::before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:var(--card2);border-left:0}
.idea{color:var(--muted);font-size:14px;border-left:4px solid var(--line);padding-left:10px;margin:0 0 10px;max-height:4.5em;overflow:hidden}
h2{font-size:18px;font-weight:800;margin:24px 0 10px}
.angle{padding:12px 0;border-top:2px dashed var(--line)}
.angle:first-child{border-top:0;padding-top:0}
.angle .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.angle .sc{font-size:20px}
.mini{height:8px;background:var(--line);border-radius:9px;margin:6px 0 8px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:9px}
.pro,.con{font-size:14px;margin:4px 0}
.pro b{color:#6ee7b7}.con b{color:#ff7a8a}
ul.plain{margin:0;padding-left:20px}ul.plain li{margin:5px 0;font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.cell{border:2px solid var(--c,var(--line));background:var(--card);border-radius:14px;padding:3px 2px 0;line-height:0}
.cell.pop{animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--card);border:2px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.persona{display:flex;gap:10px;padding:12px 0;border-top:2px dashed var(--line)}
.persona:first-child{border-top:0;padding-top:0}
.persona .av{flex:none;line-height:0}
.persona .b{flex:1;min-width:0}
.persona .h{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}
.persona .lens{color:var(--muted);font-size:13px}
.persona p{margin:6px 0 0;font-size:15px;background:var(--card2);border-radius:14px;padding:8px 12px}
.pill{min-width:34px;text-align:center;border-radius:10px;padding:0 8px;font-weight:800;color:#2b2750;height:24px;line-height:24px}
.hist{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);color:var(--text);border-radius:20px;padding:12px;margin-bottom:10px;font:inherit}
.hist .m{flex:1;min-width:0}
.hist .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:700}
.hist .d{color:var(--muted);font-size:12px;margin-top:2px}
.hist .s{font-size:26px;font-weight:800;min-width:44px;text-align:right}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.3);max-width:640px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet .row{display:flex;gap:12px}
#sheet .x{position:absolute;top:10px;right:12px;background:var(--card2);border:0;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:800}
#sheet p{margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}.cell.pop,#sheet{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Fikir Jürisi</h1>
    <div class="nav">
      <button id="nNew" aria-pressed="true">Yeni</button>
      <button id="nHist" aria-pressed="false">Geçmiş</button>
      <button id="nSet" aria-pressed="false">Ayar</button>
    </div>
  </header>

  <section id="vNew">
    <div class="card">
      <div class="hero" id="hero"></div>
      <p class="lead">Fikrini yaz. Seni hiç tanımayan, kimseyi kayırmayan karakterler kendi gözünden puanlasın.</p>
      <label for="idea" style="margin-top:0">Fikir</label>
      <textarea id="idea" placeholder="Ne yapmak istiyorsun? Kime satacaksın? Nasıl para kazanacaksın? Ne kadar ayrıntı yazarsan jüri o kadar isabetli olur."></textarea>
      <label>Jüri büyüklüğü</label>
      <div class="seg" id="size">
        <button data-n="36" aria-pressed="false">Hızlı<small>36 kişi</small></button>
        <button data-n="72" aria-pressed="false">Standart<small>72 kişi</small></button>
        <button data-n="999" aria-pressed="true">Tam<small>herkes</small></button>
      </div>
      <button class="primary" id="go">Jüriyi topla</button>
      <div class="err hidden" id="err"></div>
    </div>
  </section>

  <section id="vProg" class="hidden">
    <div class="card">
      <div id="progTitle" style="font-weight:800">Jüri salona giriyor…</div>
      <div class="bar"><i id="progBar"></i></div>
      <div class="muted" id="progTxt"></div>
    </div>
    <div class="card"><div class="grid" id="arrive"></div></div>
  </section>

  <section id="vRes" class="hidden"></section>
  <section id="vHist" class="hidden"></section>

  <section id="vSet" class="hidden">
    <div class="card">
      <label for="key" style="margin-top:0">Anthropic API anahtarı</label>
      <input id="key" type="password" autocomplete="off" placeholder="sk-ant-…">
      <label for="model">Model</label>
      <input id="model" type="text" autocapitalize="off" autocomplete="off">
      <p class="muted">Anahtar yalnızca bu telefonun tarayıcı deposunda durur, koda yazılmaz. Fikirlerin doğrudan Anthropic’e gider.</p>
      <button class="primary" id="saveSet">Kaydet</button>
      <div class="muted" id="setMsg" style="margin-top:8px"></div>
    </div>
    <button class="ghost" id="clearHist">Geçmişi sil</button>
  </section>
</main>
<div id="sheet" class="hidden" role="dialog" aria-label="Jüri üyesi"></div>

/* ---------- API ---------- */
async function api(system, user, maxTokens, tries = 3) {
  const key = store.get("fj_key");
  const model = store.get("fj_model", "claude-sonnet-5-5");
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({ model, max_tokens: maxTokens, system, messages: [{ role: "user", content: user }] })
      });
      if (!r.ok) {
        const t = await r.text();
        if ([429, 500, 502, 503, 529].includes(r.status) && i < tries - 1) { await new Promise(s => setTimeout(s, 1500 * (i + 1))); continue; }
        throw new Error(`API hatası ${r.status}: ${t.slice(0, 200)}`);
      }
      const d = await r.json();
      return d.content.map(c => c.text || "").join("");
    } catch (e) { lastErr = e; if (i < tries - 1) await new Promise(s => setTimeout(s, 1200)); }
  }
  throw lastErr;
}
function parseJSON(t) {
  const s = t.replace(/```json|```/g, "");
  const a = s.search(/[\[{]/);
  const close = s[a] === "[" ? "]" : "}";
  return JSON.parse(s.slice(a, s.lastIndexOf(close) + 1));
}

async function runBatch(idea, items) {
  const user = `FİKİR:\n"""${idea}"""\n\nPERSONALAR:\n` + items.map(x => `${x.idx}. ${x.p.ad} — ${x.p.bakis}`).join("\n");
  const out = parseJSON(await api(SYS_PERSONA, user, 4000));
  return out.filter(o => items.some(x => x.idx === o.i));
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const toPersona = o => ({ idx: o.i, ad: PERSONAS[o.i].ad, bakis: PERSONAS[o.i].bakis, cat: PERSONAS[o.i].cat, puan: Math.max(1, Math.min(10, Math.round(+o.puan) || 5)), karar: o.karar || "belirsiz", yorum: o.yorum || "" });

async function evaluate(idea) {
  const pool = shuffle(PERSONAS.map((p, idx) => ({ p, idx }))).slice(0, Math.min(size, PERSONAS.length));
  const BATCH = 12, CONC = 4;
  const chunks = []; for (let i = 0; i < pool.length; i += BATCH) chunks.push(pool.slice(i, i + BATCH));
  const results = []; let done = 0, next = 0, failed = 0, firstErr = null;
  $("arrive").innerHTML = "";
  const upd = () => { $("progBar").style.width = Math.round(done / pool.length * 85) + "%"; $("progTxt").textContent = `${results.length} jüri üyesi salonda, ${pool.length - done} kişi bekleniyor`; };
  upd();
  async function worker() {
    while (next < chunks.length) {
      const c = chunks[next++];
      try {
        const r = await runBatch(idea, c);
        r.forEach(o => {
          results.push(o);
          const p = toPersona(o);
          const b = document.createElement("div");
          b.className = "cell pop"; b.style.setProperty("--c", col(p.puan)); b.innerHTML = avatar(p.idx, p.puan, 34);
          $("arrive").appendChild(b);
        });
        done += c.length;
      } catch (e) { failed++; done += c.length; firstErr = firstErr || e; }
      upd();
    }
  }
  await Promise.all(Array.from({ length: CONC }, worker));
  if (results.length < Math.min(6, pool.length)) throw firstErr || new Error("Yeterli jüri yanıtı alınamadı.");

  const personas = results.map(toPersona);
  const avg = personas.reduce((s, x) => s + x.puan, 0) / personas.length;
  $("progTitle").textContent = "Jüri başkanı kararı yazıyor…";
  $("progBar").style.width = "92%";
  const digest = personas.map(x => `${x.ad} [${x.puan}/10, ${x.karar}]: ${x.yorum.slice(0, 200)}`).join("\n");
  const synth = parseJSON(await api(SYS_SYNTH, `FİKİR:\n"""${idea}"""\n\nJÜRİ ÜYELERİ (${personas.length} kişi, ortalama ${avg.toFixed(2)}/10):\n${digest}`, 4000));
  $("progBar").style.width = "100%";
  return { id: Date.now(), tarih: new Date().toISOString(), fikir: idea, ortalama: avg, personalar: personas, sentez: synth };
}

    <div class="card">${(s.acilar || []).map((a, i) => `
      <div class="angle">
        <div class="top"><span>${ANGLE_ICON[i] || ""} ${esc(a.ad)}</span><span class="sc" style="color:${col(a.puan)}">${esc(a.puan)}<span class="muted">/10</span></span></div>
        <div class="mini"><i style="width:${(+a.puan || 0) * 10}%;background:${col(a.puan)}"></i></div>
        <div class="pro"><b>Neden olabilir:</b> ${esc(a.olur)}</div>
        <div class="con"><b>Neden olmayabilir:</b> ${esc(a.olmaz)}</div>
      </div>`).join("")}</div>
    <h2>Hangi açılardan uygun</h2><div class="card"><ul class="plain">${list(s.uygun_acilar)}</ul></div>
    <h2>Hangi açılardan uygun değil</h2><div class="card"><ul class="plain">${list(s.uygun_olmayan_acilar)}</ul></div>
    <h2>En büyük riskler</h2><div class="card"><ul class="plain">${list(s.buyuk_riskler)}</ul></div>
    <h2>Önce bunu dene</h2><div class="card">${esc(s.ilk_adim)}</div>
    <h2>Tüm jüri yorumları</h2>
    <div class="chips" id="chips">
      <button data-f="all" aria-pressed="true">Hepsi</button>
      <button data-f="hi" aria-pressed="false">Olumlu (7+)</button>
      <button data-f="mid" aria-pressed="false">Kararsız (5-6)</button>
      <button data-f="lo" aria-pressed="false">Olumsuz (≤4)</button>
    </div>
    <div class="card" id="plist"></div>
    <button class="ghost" id="again" style="width:100%">Yeni fikir değerlendir</button>`;
  const draw = f => {
    const m = { all: () => true, hi: x => x.puan >= 7, mid: x => x.puan >= 5 && x.puan <= 6, lo: x => x.puan <= 4 }[f];
    $("plist").innerHTML = sorted.filter(m).map(x => `
      <div class="persona"><div class="av">${avatar(x.idx, x.puan, 46)}</div>
      <div class="b"><div class="h"><span>${esc(x.ad)}</span><span class="pill" style="background:${col(x.puan)}">${x.puan}</span></div>
      <div class="lens">${esc(x.bakis)}</div><p>${esc(x.yorum)}</p></div></div>`).join("") || `<div class="muted">Bu grupta kimse yok.</div>`;
  };
  draw("all");
  $("hall").onclick = e => { const b = e.target.closest(".cell"); if (b) openSheet(sorted[+b.dataset.k]); };
  $("chips").onclick = e => { const b = e.target.closest("button"); if (!b) return; [...$("chips").children].forEach(x => x.setAttribute("aria-pressed", x === b)); draw(b.dataset.f); };
  $("again").onclick = () => { $("idea").value = ""; show("vNew"); };
  show("vRes");
}
function renderHist() {
  const h = loadHist();
  $("vHist").innerHTML = h.length ? h.map(r => `
    <button class="hist" data-id="${r.id}">
      <div style="line-height:0">${avatar(CHAIR, (+r.sentez.genel_puan || 0) / 10, 40)}</div>
      <div class="m"><div class="t">${esc(r.fikir)}</div><div class="d">${new Date(r.tarih).toLocaleDateString("tr-TR")} · ${r.personalar.length} kişilik jüri</div></div>
      <div class="s" style="color:${col((+r.sentez.genel_puan || 0) / 10)}">${Math.round(r.sentez.genel_puan)}</div>
    </button>`).join("") : `<div class="card muted">Henüz değerlendirilmiş fikir yok.</div>`;
  $("vHist").onclick = e => { const b = e.target.closest(".hist"); if (!b) return; const r = loadHist().find(x => String(x.id) === b.dataset.id); if (r) renderResult(r); };
}

/* ---------- Başlat ---------- */
$("hero").innerHTML = ["fin","mus","paz","tek","huk","bil"].map(c => avatar(PERSONAS.findIndex(p => p.cat === c) + 1, null, 58)).join("");
$("go").onclick = async () => {
  const idea = $("idea").value.trim(), err = $("err");
  err.classList.add("hidden");
  if (idea.length < 15) { err.textContent = "Fikri biraz daha ayrıntılı yaz (en az birkaç cümle)."; err.classList.remove("hidden"); return; }
  if (!store.get("fj_key")) { err.textContent = "Önce Ayar sekmesinden API anahtarını gir."; err.classList.remove("hidden"); return; }
  $("go").disabled = true;
  $("progTitle").textContent = "Jüri salona giriyor…"; $("progBar").style.width = "0";
  show("vProg");
  try {
    const rec = await evaluate(idea);
    const h = loadHist(); h.unshift(rec); store.set("fj_hist", JSON.stringify(h.slice(0, 30)));
    renderResult(rec);
  } catch (e) {
    show("vNew"); err.textContent = "Bir hata oluştu: " + (e.message || e); err.classList.remove("hidden");
  } finally { $("go").disabled = false; }
};

// Eski sürümden kalan service worker varsa temizle
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if (!store.get("fj_key")) $("nSet").click();
</script>
</body>
</html>
